{% extends "base.html" %}

{% block title %}Edit Patient - {{ patient.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header bg-warning">
                    <h4 class="mb-0">
                        <i class="fas fa-edit"></i> Edit Patient: {{ patient.name }}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <h5 class="mb-3">Personal Information</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="name" name="name" value="{{ patient.name }}" required>
                            </div>
                            <div class="col-md-3">
                                <label for="age" class="form-label">Age *</label>
                                <input type="number" class="form-control" id="age" name="age" value="{{ patient.age }}" required>
                            </div>
                            <div class="col-md-3">
                                <label for="gender" class="form-label">Gender</label>
                                <select class="form-select" id="gender" name="gender">
                                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="date_of_birth" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" value="{{ patient.date_of_birth }}">
                            </div>
                            <div class="col-md-6">
                                <label for="blood_group" class="form-label">Blood Group</label>
                                <select class="form-select" id="blood_group" name="blood_group">
                                    <option value="">Select...</option>
                                    <option value="A+" {% if patient.blood_group == 'A+' %}selected{% endif %}>A+</option>
                                    <option value="A-" {% if patient.blood_group == 'A-' %}selected{% endif %}>A-</option>
                                    <option value="B+" {% if patient.blood_group == 'B+' %}selected{% endif %}>B+</option>
                                    <option value="B-" {% if patient.blood_group == 'B-' %}selected{% endif %}>B-</option>
                                    <option value="O+" {% if patient.blood_group == 'O+' %}selected{% endif %}>O+</option>
                                    <option value="O-" {% if patient.blood_group == 'O-' %}selected{% endif %}>O-</option>
                                    <option value="AB+" {% if patient.blood_group == 'AB+' %}selected{% endif %}>AB+</option>
                                    <option value="AB-" {% if patient.blood_group == 'AB-' %}selected{% endif %}>AB-</option>
                                </select>
                            </div>
                        </div>
                        
                        <h5 class="mb-3 mt-4">Contact Information</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="contact_number" class="form-label">Contact Number</label>
                                <input type="tel" class="form-control" id="contact_number" name="contact_number" value="{{ patient.contact_number }}">
                            </div>
                            <div class="col-md-6">
                                <label for="alternate_number" class="form-label">Alternate Number</label>
                                <input type="tel" class="form-control" id="alternate_number" name="alternate_number" value="{{ patient.alternate_number }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ patient.email }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" name="address" rows="2">{{ patient.address }}</textarea>
                        </div>
                        
                        <h5 class="mb-3 mt-4">Medical Information</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="smoking_status" class="form-label">Smoking Status</label>
                                <select class="form-select" id="smoking_status" name="smoking_status">
                                    <option value="">Select...</option>
                                    <option value="Never" {% if patient.smoking_status == 'Never' %}selected{% endif %}>Never</option>
                                    <option value="Former" {% if patient.smoking_status == 'Former' %}selected{% endif %}>Former</option>
                                    <option value="Current" {% if patient.smoking_status == 'Current' %}selected{% endif %}>Current</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="alcohol_consumption" class="form-label">Alcohol Consumption</label>
                                <select class="form-select" id="alcohol_consumption" name="alcohol_consumption">
                                    <option value="">Select...</option>
                                    <option value="Never" {% if patient.alcohol_consumption == 'Never' %}selected{% endif %}>Never</option>
                                    <option value="Occasional" {% if patient.alcohol_consumption == 'Occasional' %}selected{% endif %}>Occasional</option>
                                    <option value="Regular" {% if patient.alcohol_consumption == 'Regular' %}selected{% endif %}>Regular</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="allergies" class="form-label">Allergies</label>
                            <textarea class="form-control" id="allergies" name="allergies" rows="2">{{ patient.allergies }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="chronic_diseases" class="form-label">Chronic Diseases</label>
                            <textarea class="form-control" id="chronic_diseases" name="chronic_diseases" rows="2">{{ patient.chronic_diseases }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="family_history" class="form-label">Family History</label>
                            <textarea class="form-control" id="family_history" name="family_history" rows="2">{{ patient.family_history }}</textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Patient
                            </button>
                            <a href="{{ url_for('doctor.view_patient', patient_id=patient.id) }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
